[project]
name = "rag-mistral"
version = "0.2.0"
description = "Backend RAG FastAPI, Mistral et Vespa"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.11,<3",
    "mistralai-search-toolkit[vespa]==0.0.14",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: utilise Vespa reel sans appel payant Mistral"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
